name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aegis_ci_admin
          POSTGRES_PASSWORD: ci_isolated_admin_only
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_ci_admin -d aegis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://aegis_ci_admin:ci_isolated_admin_only@127.0.0.1:5432/aegis_test
      TEST_DATABASE_URL: postgres://aegis_app:ci_isolated_runtime_only@127.0.0.1:5432/aegis_test
      TEST_DOCUMENT_INGEST_URL: postgres://aegis_ingest:ci_isolated_ingestion_only@127.0.0.1:5432/aegis_test
      DATABASE_APP_PASSWORD: ci_isolated_runtime_only
      DATABASE_INGEST_PASSWORD: ci_isolated_ingestion_only
      # Synthetic workload login roles on the disposable aegis_test database. Migrations create them NOLOGIN; the preparation step gives
      # each its own credential, and each test process reads its own URL. Passwords are never printed.
      AGENT_ROLE_PASSWORD_ORCHESTRATOR: ci-isolated-orchestrator-role
      AGENT_ROLE_PASSWORD_TRIAGE: ci-isolated-triage-role-only
      AGENT_ROLE_PASSWORD_RETRIEVAL: ci-isolated-retrieval-role-only
      AGENT_ROLE_PASSWORD_REVIEWER: ci-isolated-reviewer-role-only
      AGENT_ROLE_PASSWORD_GATEWAY: ci-isolated-gateway-role-only
      AGENT_ROLE_PASSWORD_OPERATOR: ci-isolated-operator-role-only
      TEST_ROLE_URL_ORCHESTRATOR: postgres://aegis_orchestrator:ci-isolated-orchestrator-role@127.0.0.1:5432/aegis_test
      TEST_ROLE_URL_TRIAGE: postgres://aegis_triage:ci-isolated-triage-role-only@127.0.0.1:5432/aegis_test
      TEST_ROLE_URL_RETRIEVAL: postgres://aegis_retrieval:ci-isolated-retrieval-role-only@127.0.0.1:5432/aegis_test
      TEST_ROLE_URL_REVIEWER: postgres://aegis_reviewer:ci-isolated-reviewer-role-only@127.0.0.1:5432/aegis_test
      TEST_ROLE_URL_GATEWAY: postgres://aegis_gateway:ci-isolated-gateway-role-only@127.0.0.1:5432/aegis_test
      TEST_ROLE_URL_OPERATOR: postgres://aegis_operator:ci-isolated-operator-role-only@127.0.0.1:5432/aegis_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Automated tests and measured coverage
        run: npm run test:coverage
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflow tests (mocked identity and API)
        run: npm run test:e2e -w apps/web
      - name: Prepare integration database and workload roles
        run: npm run test:integration:prepare -w apps/api
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Check whitespace errors
        run: git diff --check
      - name: Validate Auth0 Terraform (no credentials)
        working-directory: infra/terraform/auth0
        env:
          TF_REGISTRY_CLIENT_TIMEOUT: "45"
          TF_REGISTRY_DISCOVERY_RETRY: "2"
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/
            apps/web/coverage/
          if-no-files-found: warn
