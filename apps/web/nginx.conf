server {
  listen 8080;
  server_name _;
  client_max_body_size 64k;

  # Docker's embedded DNS. Resolving at request time means the proxy keeps working after the API container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # The runtime configuration is read at every page load, so it is never cached.
  location = /config.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
