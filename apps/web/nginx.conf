server {
  listen 8080;
  server_name _;
  client_max_body_size 64k;

  # Docker's embedded DNS. Resolving at request time means the proxy keeps working after the API container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/aegis-security-headers.conf;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # The runtime configuration is read at every page load, so it is never cached.
  location = /config.json {
    root /usr/share/nginx/html;
    # A location that sets headers does not inherit the server's, so the security headers are included again here.
    include /etc/nginx/aegis-security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # The silent renewal page is framed by the application itself, so it alone may be framed by the same origin.
  location = /silent-renew.html {
    root /usr/share/nginx/html;
    include /etc/nginx/aegis-security-headers-silent.conf;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
