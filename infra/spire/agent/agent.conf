# SPIRE agent, one per workload container (the agent shares that container's PID namespace so the Unix attestor can see the caller).
# Pinned image: ghcr.io/spiffe/spire-agent:1.13.3. The same file is used for every agent; only the mounted node credential differs.
agent {
  data_dir = "/opt/spire/data/agent"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  trust_domain = "aegis.local"
  trust_bundle_path = "/opt/spire/conf/bundle/bundle.pem"
  socket_path = "/run/spire/sockets/agent.sock"
}

plugins {
  NodeAttestor "x509pop" {
    plugin_data {
      private_key_path = "/opt/spire/conf/node/node.key"
      certificate_path = "/opt/spire/conf/node/node.crt"
    }
  }
  KeyManager "memory" {
    plugin_data {}
  }
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}

telemetry {
  Prometheus {
    host = "0.0.0.0"
    port = 9988
  }
}
