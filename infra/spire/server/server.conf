# SPIRE server for the local AEGIS trust domain. Node attestation: x509pop only (no join tokens, no Docker attestor).
# Pinned image: ghcr.io/spiffe/spire-server:1.13.3 (see docker-compose.yml). Not exposed to the host.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "aegis.local"
  data_dir = "/opt/spire/data/server"
  log_level = "INFO"
  ca_ttl = "24h"
  # Short-lived workload identities: renewal is exercised continuously and a compromised SVID expires quickly.
  default_x509_svid_ttl = "5m"
  ca_subject = {
    country = ["AU"]
    organization = ["AEGIS local platform"]
    common_name = "AEGIS local SPIRE CA"
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }
  NodeAttestor "x509pop" {
    plugin_data {
      ca_bundle_path = "/opt/spire/conf/x509pop/ca.crt"
    }
  }
}

telemetry {
  Prometheus {
    host = "0.0.0.0"
    port = 9988
  }
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8080"
  live_path = "/live"
  ready_path = "/ready"
}
