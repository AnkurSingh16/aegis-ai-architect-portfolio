# AEGIS local stack. Compose project "aegis-local": its own network and volumes. It does not reuse any other project's containers or data.
# Secrets come from .env.local, created by `node scripts/local-stack.mjs init`. Never commit that file. Every published port is bound to the
# host loopback interface only.
name: aegis-local

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: ${AEGIS_DB_ADMIN_PASSWORD:?Run node scripts/local-stack.mjs init}
      POSTGRES_DB: aegis_local
    ports:
      - '127.0.0.1:${AEGIS_PORT_POSTGRES:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis_admin -d aegis_local']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]

  # One-shot migration job. It is the only service that holds the administrator URL, and it is development-only by design.
  keycloak-db-init:
    build:
      context: ./infra/keycloak/db-init
    image: aegis-keycloak-db-init:local
    restart: 'no'
    environment:
      PGPASSWORD: ${AEGIS_DB_ADMIN_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${AEGIS_KEYCLOAK_DB_PASSWORD}
    command: ['sh', '-c', 'psql -h postgres -U aegis_admin -d aegis_local -v ON_ERROR_STOP=1 -v pw="$$KEYCLOAK_DB_PASSWORD" -f /init/init-keycloak-db.sql']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aegis]

  # Local OIDC provider (Keycloak). Realm and clients come from infra/keycloak/aegis-realm.json. Users and secrets are created by
  # scripts/keycloak-setup.mjs. The issuer is fixed to the host-facing URL, and the API reaches the JWKS over the compose network.
  keycloak:
    build:
      context: ./infra/keycloak
    image: aegis-keycloak:local
    restart: unless-stopped
    command: ['start', '--import-realm', '--http-enabled=true', '--hostname=http://localhost:8180', '--health-enabled=true']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AEGIS_KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: aegis-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:${AEGIS_PORT_KEYCLOAK:-8180}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    # Readiness of the management interface (port 9000, not published). It reports UP only after the realm is served.
    healthcheck:
      test: ['CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  migrate:
    build: *api-build
    image: aegis-api:local
    command: ['node', 'apps/api/dist/storage/migrate-cli.js']
    environment:
      NODE_ENV: development
      AEGIS_ENVIRONMENT: local
      AEGIS_ALLOWED_DATABASE_HOSTS: postgres
      DATABASE_ADMIN_URL: postgres://aegis_admin:${AEGIS_DB_ADMIN_PASSWORD}@postgres:5432/aegis_local
      DATABASE_APP_PASSWORD: ${AEGIS_DB_APP_PASSWORD}
      DATABASE_INGEST_PASSWORD: ${AEGIS_DB_INGEST_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [aegis]

  api:
    build: *api-build
    image: aegis-api:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: production
      AEGIS_ENVIRONMENT: local
      AEGIS_ALLOWED_DATABASE_HOSTS: postgres
      AEGIS_API_HOST: 0.0.0.0
      PORT: '4000'
      DATABASE_URL: postgres://aegis_app:${AEGIS_DB_APP_PASSWORD}@postgres:5432/aegis_local
      OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-http://localhost:8180/realms/aegis}
      OIDC_AUDIENCE: ${AEGIS_OIDC_AUDIENCE:-aegis-api}
      # Keys are fetched over the compose network. The token issuer stays the host-facing URL, which is compared exactly.
      OIDC_JWKS_URI: http://keycloak:8080/realms/aegis/protocol/openid-connect/certs
      AEGIS_ALLOWED_SERVICE_HOSTS: keycloak,otel-collector
      # Telemetry: OpenTelemetry SDK exporting to the local collector only. Attribute allowlist applied in the process.
      AEGIS_OTEL_ENABLED: '1'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - '127.0.0.1:${AEGIS_PORT_API:-4110}:4000'
    # Hardening: no capabilities, no privilege escalation, read-only root filesystem.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [aegis]

  # OpenTelemetry Collector. Receives OTLP/HTTP from the API on the compose network only. Not published to the host.
  otel-collector:
    build:
      context: ./infra/otel
    image: aegis-otel-collector:local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis, agent-mesh]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: aegis-web:local
    restart: unless-stopped
    environment:
      # Public browser configuration only. No secret is passed to the web tier.
      AEGIS_WEB_OIDC_ENABLED: 'true'
      AEGIS_WEB_ENVIRONMENT: local
      AEGIS_WEB_OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-http://localhost:8180/realms/aegis}
      AEGIS_WEB_OIDC_CLIENT_ID: aegis-web
      AEGIS_WEB_OIDC_AUDIENCE: ${AEGIS_OIDC_AUDIENCE:-aegis-api}
      AEGIS_WEB_OIDC_SCOPES: 'openid read:cases write:cases'
      AEGIS_WEB_REDIRECT_PATH: /
      AEGIS_WEB_POST_LOGOUT_PATH: /
      AEGIS_WEB_SILENT_RENEW: 'true'
      AEGIS_WEB_DEMO_ROUTES: 'false'
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${AEGIS_PORT_WEB:-5190}:8080'
    # nginx starts as root to set up its cache directories, so it needs only these three capabilities.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  # Observability backends. Only Grafana is published to the host (loopback, authenticated). Ingestion and query endpoints stay on the
  # compose network. Each store has a bounded retention; see docs/OBSERVABILITY.md.
  tempo:
    build:
      context: ./infra/observability
      dockerfile: Dockerfile.tempo
    image: aegis-tempo:local
    restart: unless-stopped
    volumes:
      - tempo-data:/var/tempo
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  loki:
    build:
      context: ./infra/observability
      dockerfile: Dockerfile.loki
    image: aegis-loki:local
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  prometheus:
    build:
      context: ./infra/observability
      dockerfile: Dockerfile.prometheus
    image: aegis-prometheus:local
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis, spire-control, agent-mesh]

  blackbox-exporter:
    build:
      context: ./infra/observability
      dockerfile: Dockerfile.blackbox
    image: aegis-blackbox:local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  grafana:
    build:
      context: ./infra/observability/grafana
    image: aegis-grafana:local
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: aegis-admin
      GF_SECURITY_ADMIN_PASSWORD: ${AEGIS_GRAFANA_ADMIN_PASSWORD:?Run node scripts/local-stack.mjs init}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      # No plugin download at start-up (a third-party download is not needed for the provisioned dashboards).
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    ports:
      - '127.0.0.1:${AEGIS_PORT_GRAFANA:-3300}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  # SPIRE workload identity (P3). Socket-free: x509pop node attestation and Unix workload attestation. No Docker socket, no privileged
  # containers, no host networking, no host filesystem beyond single credential files in AEGIS_SPIRE_SECRETS_DIR (outside the repository).
  # Each workload has its own agent container that shares ONLY that workload's PID namespace (pid: service:<workload>), so the Unix
  # attestor can see the calling process. Workload API sockets live in per-workload volumes that no other workload mounts.
  spire-server:
    build:
      context: ./infra/spire/server
    image: aegis-spire-server:local
    pull_policy: never
    restart: unless-stopped
    command: ['-config', '/opt/spire/conf/server/server.conf']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR:?Run node scripts/spire-bootstrap.mjs}/ca.crt:/opt/spire/conf/x509pop/ca.crt:ro
      - spire-server-data:/opt/spire/data/server
    healthcheck:
      test: ['CMD', '/opt/spire/bin/spire-server', 'healthcheck']
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [spire-control]

  orchestrator:
    build:
      context: ./infra/spire
      dockerfile: workload/Dockerfile
    image: aegis-spire-workload:local
    pull_policy: never
    restart: unless-stopped
    user: '1001:1001'
    command: ['serve']
    environment:
      AEGIS_SPIRE_SOCKET: unix:///run/spire/sockets/agent.sock
      AEGIS_POLICY_PATH: /etc/aegis/spire-policy.json
      AEGIS_SERVICE_NAME: aegis-workload-orchestrator
      AEGIS_OTEL_ENDPOINT: otel-collector:4318
    volumes:
      - spire-socket-orchestrator:/run/spire/sockets
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]

  triage:
    image: aegis-spire-workload:local
    pull_policy: never
    depends_on: [orchestrator]
    restart: unless-stopped
    user: '1002:1002'
    command: ['serve']
    environment:
      AEGIS_SPIRE_SOCKET: unix:///run/spire/sockets/agent.sock
      AEGIS_POLICY_PATH: /etc/aegis/spire-policy.json
      AEGIS_SERVICE_NAME: aegis-workload-triage
      AEGIS_OTEL_ENDPOINT: otel-collector:4318
    volumes:
      - spire-socket-triage:/run/spire/sockets
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]

  retrieval:
    image: aegis-spire-workload:local
    pull_policy: never
    depends_on: [orchestrator]
    restart: unless-stopped
    user: '1003:1003'
    command: ['serve']
    environment:
      AEGIS_SPIRE_SOCKET: unix:///run/spire/sockets/agent.sock
      AEGIS_POLICY_PATH: /etc/aegis/spire-policy.json
      AEGIS_SERVICE_NAME: aegis-workload-retrieval
      AEGIS_OTEL_ENDPOINT: otel-collector:4318
    volumes:
      - spire-socket-retrieval:/run/spire/sockets
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]

  reviewer:
    image: aegis-spire-workload:local
    pull_policy: never
    depends_on: [orchestrator]
    restart: unless-stopped
    user: '1004:1004'
    command: ['serve']
    environment:
      AEGIS_SPIRE_SOCKET: unix:///run/spire/sockets/agent.sock
      AEGIS_POLICY_PATH: /etc/aegis/spire-policy.json
      AEGIS_SERVICE_NAME: aegis-workload-reviewer
      AEGIS_OTEL_ENDPOINT: otel-collector:4318
    volumes:
      - spire-socket-reviewer:/run/spire/sockets
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]

  spire-agent-orchestrator:
    build:
      context: ./infra/spire/agent
    image: aegis-spire-agent:local
    pull_policy: never
    restart: unless-stopped
    pid: 'service:orchestrator'
    depends_on: [orchestrator, spire-server]
    command: ['-config', '/opt/spire/conf/agent/agent.conf']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR}/bundle.pem:/opt/spire/conf/bundle/bundle.pem:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-orchestrator.crt:/opt/spire/conf/node/node.crt:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-orchestrator.key:/opt/spire/conf/node/node.key:ro
      - spire-socket-orchestrator:/run/spire/sockets
      - spire-agent-data-orchestrator:/opt/spire/data/agent
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [spire-control]

  spire-agent-triage:
    build:
      context: ./infra/spire/agent
    image: aegis-spire-agent:local
    pull_policy: never
    restart: unless-stopped
    pid: 'service:triage'
    depends_on: [triage, spire-server]
    command: ['-config', '/opt/spire/conf/agent/agent.conf']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR}/bundle.pem:/opt/spire/conf/bundle/bundle.pem:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-triage.crt:/opt/spire/conf/node/node.crt:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-triage.key:/opt/spire/conf/node/node.key:ro
      - spire-socket-triage:/run/spire/sockets
      - spire-agent-data-triage:/opt/spire/data/agent
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [spire-control]

  spire-agent-retrieval:
    build:
      context: ./infra/spire/agent
    image: aegis-spire-agent:local
    pull_policy: never
    restart: unless-stopped
    pid: 'service:retrieval'
    depends_on: [retrieval, spire-server]
    command: ['-config', '/opt/spire/conf/agent/agent.conf']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR}/bundle.pem:/opt/spire/conf/bundle/bundle.pem:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-retrieval.crt:/opt/spire/conf/node/node.crt:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-retrieval.key:/opt/spire/conf/node/node.key:ro
      - spire-socket-retrieval:/run/spire/sockets
      - spire-agent-data-retrieval:/opt/spire/data/agent
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [spire-control]

  spire-agent-reviewer:
    build:
      context: ./infra/spire/agent
    image: aegis-spire-agent:local
    pull_policy: never
    restart: unless-stopped
    pid: 'service:reviewer'
    depends_on: [reviewer, spire-server]
    command: ['-config', '/opt/spire/conf/agent/agent.conf']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR}/bundle.pem:/opt/spire/conf/bundle/bundle.pem:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-reviewer.crt:/opt/spire/conf/node/node.crt:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-reviewer.key:/opt/spire/conf/node/node.key:ro
      - spire-socket-reviewer:/run/spire/sockets
      - spire-agent-data-reviewer:/opt/spire/data/agent
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [spire-control]

  # ---- Acceptance-only services (profile "spire-tests"). Never started by the normal stack. ----
  # An unregistered workload with its own agent and node credential, running as UID 1002 (the same UID as triage).
  probe:
    image: aegis-spire-workload:local
    pull_policy: never
    profiles: [spire-tests]
    restart: 'no'
    user: '1002:1002'
    entrypoint: ['/bin/sleep', 'infinity']
    volumes:
      - spire-socket-probe:/run/spire/sockets
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]

  spire-agent-probe:
    build:
      context: ./infra/spire/agent
    image: aegis-spire-agent:local
    pull_policy: never
    restart: 'no'
    profiles: [spire-tests]
    pid: 'service:probe'
    depends_on: [probe, spire-server]
    command: ['-config', '/opt/spire/conf/agent/agent.conf']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR}/bundle.pem:/opt/spire/conf/bundle/bundle.pem:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-probe.crt:/opt/spire/conf/node/node.crt:ro
      - ${AEGIS_SPIRE_SECRETS_DIR}/node-probe.key:/opt/spire/conf/node/node.key:ro
      - spire-socket-probe:/run/spire/sockets
      - spire-agent-data-probe:/opt/spire/data/agent
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [spire-control]

  # Handed triage's Workload API socket on purpose: the strongest "same UID, different container" case. It is not in triage's PID
  # namespace and has no agent of its own.
  intruder:
    image: aegis-spire-workload:local
    pull_policy: never
    profiles: [spire-tests]
    restart: 'no'
    user: '1002:1002'
    entrypoint: ['/bin/sleep', 'infinity']
    volumes:
      - spire-socket-triage:/run/spire/sockets
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]

  # Test-only impersonation server: serves a certificate that CLAIMS triage's SPIFFE ID but is signed by an untrusted CA. Clients that
  # verify against the SPIRE trust bundle must refuse it. Never started by the normal stack.
  rogue:
    image: node@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    profiles: [spire-tests]
    restart: 'no'
    user: '1000:1000'
    command: ['node', '-e', 'const tls=require("tls"),fs=require("fs");tls.createServer({key:fs.readFileSync("/run/rogue/rogue.key"),cert:fs.readFileSync("/run/rogue/rogue.crt")},s=>{s.end("HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok")}).listen(8443)']
    volumes:
      - ${AEGIS_SPIRE_SECRETS_DIR}/rogue:/run/rogue:ro
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [agent-mesh]


volumes:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  spire-server-data:
  spire-socket-orchestrator:
  spire-socket-triage:
  spire-socket-retrieval:
  spire-socket-reviewer:
  spire-socket-probe:
  spire-agent-data-orchestrator:
  spire-agent-data-triage:
  spire-agent-data-retrieval:
  spire-agent-data-reviewer:
  spire-agent-data-probe:

networks:
  aegis:
    driver: bridge
  # Internal: no route to the internet or the host. SPIRE control traffic only.
  spire-control:
    driver: bridge
    internal: true
  # Internal: workload-to-workload mTLS traffic only.
  agent-mesh:
    driver: bridge
    internal: true
