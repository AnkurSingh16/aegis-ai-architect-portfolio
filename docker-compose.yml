# OPTIONAL phase-2 local development database. Not required for first `npm run dev`.
# Change credentials before exposing outside your Mac. Bound to loopback only.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aegis_local
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: aegis_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - aegis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis_local -d aegis_local']
      interval: 10s
      retries: 5
volumes:
  aegis_postgres:
