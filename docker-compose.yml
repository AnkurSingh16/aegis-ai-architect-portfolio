# Persistent local-development database. The stateless browser demo remains optional-DB.
# Set POSTGRES_PASSWORD in ignored .env; never expose the database publicly.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aegis_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aegis_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - aegis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis_local -d aegis_local']
      interval: 10s
      retries: 5
volumes:
  aegis_postgres:
