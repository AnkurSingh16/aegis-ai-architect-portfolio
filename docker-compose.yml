# AEGIS local stack. Compose project "aegis-local": its own network and volumes. It does not reuse any other project's containers or data.
# Secrets come from .env.local, created by `node scripts/local-stack.mjs init`. Never commit that file. Every published port is bound to the
# host loopback interface only.
name: aegis-local

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: ${AEGIS_DB_ADMIN_PASSWORD:?Run node scripts/local-stack.mjs init}
      POSTGRES_DB: aegis_local
    ports:
      - '127.0.0.1:${AEGIS_PORT_POSTGRES:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis_admin -d aegis_local']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegis]

  # One-shot migration job. It is the only service that holds the administrator URL, and it is development-only by design.
  keycloak-db-init:
    build:
      context: ./infra/keycloak/db-init
    image: aegis-keycloak-db-init:local
    restart: 'no'
    environment:
      PGPASSWORD: ${AEGIS_DB_ADMIN_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${AEGIS_KEYCLOAK_DB_PASSWORD}
    command: ['sh', '-c', 'psql -h postgres -U aegis_admin -d aegis_local -v ON_ERROR_STOP=1 -v pw="$$KEYCLOAK_DB_PASSWORD" -f /init/init-keycloak-db.sql']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aegis]

  # Local OIDC provider (Keycloak). Realm and clients come from infra/keycloak/aegis-realm.json. Users and secrets are created by
  # scripts/keycloak-setup.mjs. The issuer is fixed to the host-facing URL, and the API reaches the JWKS over the compose network.
  keycloak:
    build:
      context: ./infra/keycloak
    image: aegis-keycloak:local
    restart: unless-stopped
    command: ['start', '--import-realm', '--http-enabled=true', '--hostname=http://localhost:8180', '--health-enabled=true']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AEGIS_KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: aegis-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:${AEGIS_PORT_KEYCLOAK:-8180}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    # Readiness of the management interface (port 9000, not published). It reports UP only after the realm is served.
    healthcheck:
      test: ['CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

  migrate:
    build: *api-build
    image: aegis-api:local
    command: ['node', 'apps/api/dist/storage/migrate-cli.js']
    environment:
      NODE_ENV: development
      AEGIS_ENVIRONMENT: local
      AEGIS_ALLOWED_DATABASE_HOSTS: postgres
      DATABASE_ADMIN_URL: postgres://aegis_admin:${AEGIS_DB_ADMIN_PASSWORD}@postgres:5432/aegis_local
      DATABASE_APP_PASSWORD: ${AEGIS_DB_APP_PASSWORD}
      DATABASE_INGEST_PASSWORD: ${AEGIS_DB_INGEST_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [aegis]

  api:
    build: *api-build
    image: aegis-api:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AEGIS_ENVIRONMENT: local
      AEGIS_ALLOWED_DATABASE_HOSTS: postgres
      AEGIS_API_HOST: 0.0.0.0
      PORT: '4000'
      DATABASE_URL: postgres://aegis_app:${AEGIS_DB_APP_PASSWORD}@postgres:5432/aegis_local
      OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-http://localhost:8180/realms/aegis}
      OIDC_AUDIENCE: ${AEGIS_OIDC_AUDIENCE:-aegis-api}
      # Keys are fetched over the compose network. The token issuer stays the host-facing URL, which is compared exactly.
      OIDC_JWKS_URI: http://keycloak:8080/realms/aegis/protocol/openid-connect/certs
      AEGIS_ALLOWED_SERVICE_HOSTS: keycloak
    ports:
      - '127.0.0.1:${AEGIS_PORT_API:-4110}:4000'
    # Hardening: no capabilities, no privilege escalation, read-only root filesystem.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [aegis]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: aegis-web:local
    restart: unless-stopped
    environment:
      # Public browser configuration only. No secret is passed to the web tier.
      AEGIS_WEB_OIDC_ENABLED: 'true'
      AEGIS_WEB_ENVIRONMENT: local
      AEGIS_WEB_OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-http://localhost:8180/realms/aegis}
      AEGIS_WEB_OIDC_CLIENT_ID: aegis-web
      AEGIS_WEB_OIDC_AUDIENCE: ${AEGIS_OIDC_AUDIENCE:-aegis-api}
      AEGIS_WEB_OIDC_SCOPES: 'openid read:cases write:cases'
      AEGIS_WEB_REDIRECT_PATH: /
      AEGIS_WEB_POST_LOGOUT_PATH: /
      AEGIS_WEB_SILENT_RENEW: 'true'
      AEGIS_WEB_DEMO_ROUTES: 'false'
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${AEGIS_PORT_WEB:-5190}:8080'
    # nginx starts as root to set up its cache directories, so it needs only these three capabilities.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    networks: [aegis]

volumes:
  postgres-data:

networks:
  aegis:
    driver: bridge
